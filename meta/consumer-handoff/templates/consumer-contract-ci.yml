name: term-prep contract

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install term-prep package pin
        run: |
          python -m pip install --upgrade pip
          python -m pip install "term-prep-platform==1.*"

      - name: Contract check (schema + major)
        run: |
          term-prep-contract-check --config meta/glossary-config.json --expect-major 1

      - name: Glossary check mode
        run: |
          term-prep-extract --check --config meta/glossary-config.json
